plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing key lives outside version control (see keystore.properties.example)
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'com.cowweight.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.anish.cowweight"   // new ID so it never clashes with the old debug-signed install
        minSdk 24          // Android 7.0+ (lowest ONNX Runtime supports); covers ~98% of phones in use
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile     rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias      keystoreProps['keyAlias']
                keyPassword   keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    androidResources {
        noCompress "tflite", "lite", "onnx"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // Native libraries below are all 16 KB page-aligned (required on newer Android 15+ devices)

    // Cow detection (YOLOv8n ONNX)
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.22.0'

    // Weight estimation model (clean_weight_model.tflite) — LiteRT is the renamed TensorFlow Lite,
    // same org.tensorflow.lite API
    implementation 'com.google.ai.edge.litert:litert:1.4.0'

    // Live camera
    def camerax = "1.4.2"
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
}
